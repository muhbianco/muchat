# Fragmento Traefik (file provider). Merge em /root/dynamic_conf.yaml —
# não apagar o router api.dev.
#
# Chat aberto no host. Cadastro nativo é invite-only no Stoat (Revolt.toml).
# Sem ForwardAuth / Discord.

http:
  middlewares:
    muchat-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "no-referrer"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"
        permissionsPolicy: "camera=(self), microphone=(self), display-capture=(self)"
  routers:
    muchat:
      rule: "Host(`chat.muhbianco.com.br`)"
      priority: 10
      service: muchat
      entryPoints:
        - websecure
      tls:
        certResolver: letsencryptresolver
      middlewares:
        - muchat-headers
  services:
    muchat:
      loadBalancer:
        servers:
          - url: "http://caddy:80"
        passHostHeader: true
