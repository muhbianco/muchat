# Overlay Muchat: Traefik já ocupa 80/443. Caddy só na overlay stoat-net.
# LiveKit publica UDP/TCP no host. Limites de CPU/RAM para não comer o resto da hel1.

networks:
  default:
    name: stoat-net
    external: true

services:
  caddy:
    ports: !override []
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./brand/public:/muchat-public:ro
    depends_on:
      - web
      - api
      - events
      - autumn
      - january
      - gifbox
      - livekit
      - voice-ingress
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  invite:
    image: muchat-invite:latest
    build:
      context: .
      dockerfile: invite/Dockerfile
    environment:
      MONGO_URL: mongodb://database:27017
      MUCHAT_INVITE_SECRET: ${MUCHAT_INVITE_SECRET:?MUCHAT_INVITE_SECRET missing}
      PUBLIC_URL: ${PUBLIC_URL:-https://chat.muhbianco.com.br}
    ports:
      - "127.0.0.1:8091:8091"
    restart: always
    depends_on:
      - database
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

  livekit:
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1G

  database:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  rabbit:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  minio:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  api:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  events:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  web:
    volumes:
      - ./brand/generated-index.html:/app/dist_injected/index.html:ro
      - ./brand/generated-index.html:/app/dist/index.html:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  autumn:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
