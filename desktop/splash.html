<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Muchat</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #141210;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
    }
    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }
    .track {
      width: 180px;
      height: 6px;
      border-radius: 99px;
      background: #2b2926;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 40%;
      border-radius: 99px;
      background: #e85a2a;
      animation: muchat-load 1.2s ease-in-out infinite;
    }
    .bar.is-pct {
      animation: none;
      transition: width 0.25s ease;
    }
    .label {
      margin: 0;
      color: #8a8378;
      font-size: 13px;
    }
    .version {
      margin: 0;
      color: #8a8378;
      font-size: 12px;
      letter-spacing: 0.02em;
    }
    @keyframes muchat-load {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="icon.png" alt="Muchat">
    <div class="track" aria-hidden="true"><div class="bar" id="bar"></div></div>
    <p class="label" id="label">Carregando…</p>
    <p class="version" id="version"></p>
  </div>
  <script>
    (function () {
      const bar = document.getElementById("bar");
      const label = document.getElementById("label");
      const versionEl = document.getElementById("version");
      const fromQuery = new URLSearchParams(location.search).get("v");
      const fromNative =
        window.native &&
        window.native.versions &&
        typeof window.native.versions.desktop === "function"
          ? window.native.versions.desktop()
          : "";
      const version = fromQuery || fromNative;
      if (versionEl && version) versionEl.textContent = "Muchat " + version;
      if (!window.native || typeof window.native.onLoadProgress !== "function") return;
      window.native.onLoadProgress(function (pct, text) {
        if (bar && pct != null) {
          bar.classList.add("is-pct");
          bar.style.width = Math.max(8, Math.min(100, Number(pct) || 0)) + "%";
        }
        if (label && text) label.textContent = text;
      });
    })();
  </script>
</body>
</html>
