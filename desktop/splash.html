<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Muchat</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #141210;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
    }
    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }
    .track {
      width: 180px;
      height: 6px;
      border-radius: 99px;
      background: #2b2926;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 40%;
      border-radius: 99px;
      background: #e85a2a;
      animation: muchat-load 1.2s ease-in-out infinite;
    }
    .label {
      margin: 0;
      color: #8a8378;
      font-size: 13px;
    }
    @keyframes muchat-load {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="icon.png" alt="Muchat">
    <div class="track" aria-hidden="true"><div class="bar"></div></div>
    <p class="label">Carregando…</p>
  </div>
</body>
</html>
